<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accumulator code trace</title>
<link rel="stylesheet" href="python-tutor-assets/q4-trace.css">
<style>
.code-lines{padding:12px 12px 12px 3em;background:#f5f5f5;overflow-wrap:anywhere}.code-lines li{white-space:pre-wrap;font-family:monospace;padding:2px 8px}.code-lines [aria-current=step]{background:#ffe5ae;border-left:4px solid #7a4000}dl{display:flex;gap:12px;flex-wrap:wrap}dt{font-weight:bold}dd{margin:0 20px 0 0}
</style>
<script src="accumulator-trace.js" defer></script>
</head>
<body><main aria-labelledby="trace-title">
<h1 id="trace-title">Accumulator code trace</h1>
<p>Predict the next values, then step through the code.</p>
<div class="controls" role="group" aria-label="Execution controls">
<button type="button" id="previous" aria-disabled="true">Previous step</button>
<button type="button" id="next" aria-disabled="true">Next step</button>
<button type="button" id="restart">Restart</button>
<button type="button" id="finish">Go to end</button>
</div>
<p id="step-status" role="status" aria-atomic="true">Loading trace…</p>
<ol class="code-lines" id="code" aria-label="Python source code"></ol>
<h2>Variables</h2><dl id="variables"></dl>
<p class="credit">Trace recorded with CPython. The next line is marked and described in text.</p>
<noscript><p>JavaScript is required for stepping. Run the example in your course notebook.</p></noscript>
</main></body></html>
